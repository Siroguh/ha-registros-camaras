name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Check tag and manifest
        run: |
          uv run python -c 'import json,os; m=json.load(open("custom_components/registros_camaras/manifest.json")); assert os.environ["GITHUB_REF_NAME"] == "v"+m["version"]'
      - run: sh scripts/check.sh
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/registros_camaras.zip --verify-tag --generate-notes
